{% extends "base_auth.html" %}

{% block title %}Шинэ нууц үг{% endblock %}

{% block content %}
  <h1>Шинэ нууц үг</h1>
  <p class="sub">Дор хаяж 10 тэмдэгттэй, таамаглахад хэцүү нууц үг сонгоно уу.</p>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" novalidate>
    {% csrf_token %}

    <label for="id_password">Шинэ нууц үг</label>
    <input type="password" name="password" id="id_password"
           autocomplete="new-password" autofocus required>

    <label for="id_password_confirm">Шинэ нууц үг давтах</label>
    <input type="password" name="password_confirm" id="id_password_confirm"
           autocomplete="new-password" required>

    <button type="submit">Нууц үг хадгалах</button>
  </form>
{% endblock %}
